
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
    commit-message:
      prefix: "NPM"
      include: "scope"
    groups:
      combine-all:
        patterns: 
          - "*"

  - package-ecosystem: "github-actions"
    # also check the composite actions, not only .github/workflows
    directories:
      - "/"
      - "/setup"
      - "/project/*"
      - "/pro/*"
    schedule:
      interval: weekly
    labels:
      - "dependencies"