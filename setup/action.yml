name: 'Setup Viash'
author: Data Intuitive
description: 'This action will setup Viash from the git repository https://github.com/viash-io/viash/'
inputs:
  version:
    description: 'The version of Viash to use. Either a release tag (e.g. 0.6.0) or "@develop" for latest development version. If missing, uses latest stable version.'
    required: false
outputs:
  path:
    description: 'The path to the installed Viash executable.'
    value: ${{ steps.install-viash.outputs.path }}
  version:
    description: 'The installed version of viash.'
    value: ${{ steps.install-viash.outputs.version }}
runs:
  using: composite
  steps: 
    - name: Download Viash Installer
      id: download-installer
      shell: bash
      run: |
        INSTALLER_PATH="$RUNNER_TEMP/viash_install"
        URL="https://github.com/viash-io/viash/releases/latest/download/viash_install"

        # download viash installer
        curl --fail -L "$URL" -o "$INSTALLER_PATH" --create-dirs

        echo "Download finished!"
        echo "INSTALLER_PATH=$INSTALLER_PATH" >> "$GITHUB_OUTPUT"

    - name: Install Viash
      id: install-viash 
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # don't use VIASH_* names here: viash reads e.g. VIASH_VERSION to pick the version to run
        INPUT_VERSION: ${{ inputs.version }}
        INSTALLER_PATH: ${{ steps.download-installer.outputs.INSTALLER_PATH }}
      run: |
        # process parameters
        extra_params=( )
        if [ -n "$INPUT_VERSION" ]; then
          extra_params+=( "--tag" "$INPUT_VERSION" )
        fi

        # set destination
        viash_dest="$HOME/.local/bin/viash"

        # create dir
        mkdir -p "$(dirname "$viash_dest")"

        # install viash
        bash "$INSTALLER_PATH" "${extra_params[@]}" --output "$viash_dest"

        # add dir to path
        dirname "$viash_dest" >> "$GITHUB_PATH"

        # check version
        "$viash_dest" -v | sed 's#viash #version=#;s# (c).*##' >> "$GITHUB_OUTPUT"

        echo "Viash installed successfully!"

        echo "path=$viash_dest" >> "$GITHUB_OUTPUT"
      shell: bash
